[workspace]
resolver = "2"
members = [
  "crates/licensing",
  "tools/license-gen",
  "src-tauri",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["you"]

[workspace.dependencies]
licensing = { path = "crates/licensing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
mid = "4"
